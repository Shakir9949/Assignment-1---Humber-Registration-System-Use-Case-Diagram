<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Humber Registration System Use Case</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <main>
        <div class="diagram">
            <div class="actor" id="admin">Program Administrator</div>
            <div class="usecase" id="view-courses">View Courses</div>
            <div class="usecase" id="add-course">Add Course</div>
            <div class="usecase" id="remove-course">Remove Course</div>
            <div class="usecase" id="edit-course">Edit Course Info</div>

            <div class="actor" id="student">Student</div>
            <div class="usecase" id="student-view">View Courses</div>
            <div class="usecase" id="student-add">Add Course</div>
            <div class="usecase" id="student-drop">Drop Course</div>
            <div class="usecase" id="student-enrolled">View Enrolled Courses</div>
            <div class="usecase include" id="prereq">Verify Prerequisites</div>
            <div class="usecase include" id="fees">Check Unpaid Fees</div>

            <div class="actor" id="instructor">Instructor</div>
            <div class="usecase" id="course-report">Print Course Reports</div>
            <div class="usecase" id="student-report">Print Student Reports</div>
        </div>
    </main>

    <!-- Popup container -->
    <div id="info-popup" class="popup hidden">
        <div class="popup-content">
            <span id="close-popup">&times;</span>
            <h2 id="popup-title"></h2>
            <ul id="popup-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
